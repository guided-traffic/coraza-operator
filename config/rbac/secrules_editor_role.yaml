# This rule is not used by the project coraza-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the waf.gtrfc.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: coraza-operator
    app.kubernetes.io/managed-by: kustomize
  name: secrules-editor-role
rules:
- apiGroups:
  - waf.gtrfc.com
  resources:
  - secrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - waf.gtrfc.com
  resources:
  - secrules/status
  verbs:
  - get
