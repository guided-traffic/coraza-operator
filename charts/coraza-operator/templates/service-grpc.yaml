apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.grpc.serviceName }}
  namespace: {{ include "coraza-operator.namespace" . }}
  labels:
    {{- include "coraza-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "coraza-operator.selectorLabels" . | nindent 4 }}
  ports:
  - name: grpc
    port: {{ .Values.grpc.port }}
    targetPort: grpc
    protocol: TCP
