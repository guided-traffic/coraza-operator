name: Release Docker & Helm

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.26.6'
  HELM_VERSION: 'v4.2.3'
  CHART_DIR: charts/coraza-operator
  PAGES_URL: https://guided-traffic.github.io/coraza-operator/

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  attestations: write

jobs:
  # The operator and the engine are two separate images built from two separate
  # Dockerfiles but released together: an Engine CR reconciled by version X of
  # the operator expects the matching engine image, so both carry the same tag.
  build:
    name: Build ${{ matrix.name }} image
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: Dockerfile
            image: guidedtraffic/coraza-operator
            title: Coraza Operator
            description: A Kubernetes operator managing Coraza WAF rules and engine fleets
          - name: engine
            dockerfile: Dockerfile.engine
            image: guidedtraffic/coraza-engine
            title: Coraza Engine
            description: The Coraza WAF engine data plane driven by the Coraza Operator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: guidedtraffic
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Docker meta
        id: tag_names
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=Guided Traffic
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/guided-traffic/coraza-operator
            org.opencontainers.image.source=https://github.com/guided-traffic/coraza-operator

      - name: Extract version without v prefix
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          file: ${{ matrix.dockerfile }}
          context: .
          platforms: linux/amd64  # ,linux/arm64
          push: true
          tags: ${{ steps.tag_names.outputs.tags }}
          labels: ${{ steps.tag_names.outputs.labels }}
          provenance: true
          sbom: true
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.description=${{ matrix.description }}

      - name: Generate and upload SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ matrix.image }}:${{ steps.version.outputs.version }}
          format: spdx-json
          upload-artifact: true
          upload-release-assets: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ github.workspace }}/guidedtraffic-coraza-${{ matrix.name }}_*.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout scan
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: ${{ matrix.image }}:${{ steps.version.outputs.version }}
          sarif-file: scout-${{ matrix.name }}.sarif
          summary: true
          dockerhub-user: guidedtraffic
          dockerhub-password: ${{ secrets.DOCKERHUB_PAT }}

  release-helm:
    name: Release Helm Chart
    needs: build
    runs-on: self-hosted
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Last line of defence before the chart reaches end-user clusters: a stale
      # checked-in CRD must never be packaged, even if CI was bypassed.
      - name: Regenerate CRDs and sync to Helm chart
        run: make generate-all

      - name: Verify generated artifacts are committed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated CRDs / DeepCopy / Helm chart CRDs are out of sync with api/v1/."
            echo "Run 'make generate-all' locally and commit the result before releasing."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi

      - name: Update chart version and image tags
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*$/version: ${VERSION}/"           ${CHART_DIR}/Chart.yaml
          sed -i "s/^appVersion:.*$/appVersion: \"${VERSION}\"/" ${CHART_DIR}/Chart.yaml
          # Both image blocks carry the same release tag; `tag:` is indented by
          # two spaces under image: and engineImage: respectively.
          sed -i "s/^  tag:.*$/  tag: \"${VERSION}\"/"           ${CHART_DIR}/values.yaml
          echo "=== Chart.yaml ==="
          grep -E '^(version|appVersion):' ${CHART_DIR}/Chart.yaml
          echo "=== values.yaml images ==="
          grep -E '^\s+(repository|tag):' ${CHART_DIR}/values.yaml

      - name: Lint and package chart
        id: package
        run: |
          set -euo pipefail
          helm lint ${CHART_DIR}
          mkdir -p dist/helm
          helm package ${CHART_DIR} --destination dist/helm
          CHART_TGZ=$(ls dist/helm/*.tgz)
          echo "chart_tgz=${CHART_TGZ}" >> $GITHUB_OUTPUT
          echo "Packaged ${CHART_TGZ}"

      # Published as a classic Helm repo on the gh-pages branch, matching the
      # sister valkey-operator project:
      #   helm repo add coraza-operator https://guided-traffic.github.io/coraza-operator/
      #
      # BOT_PAT is used instead of the persisted checkout credentials because the
      # publish happens in a separate clone of the gh-pages branch. The token
      # only ever appears in the remote URL, which Actions masks in logs.
      - name: Publish chart to gh-pages
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          CHART_TGZ: ${{ steps.package.outputs.chart_tgz }}
        run: |
          set -euo pipefail
          REPO_URL="https://x-access-token:${BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          WORK=/tmp/gh-pages
          rm -rf "$WORK"

          # gh-pages does not exist before the very first release: bootstrap it
          # as an orphan branch instead of failing.
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch --depth 1 "$REPO_URL" "$WORK"
          else
            echo "gh-pages branch not found - bootstrapping it"
            git clone --depth 1 "$REPO_URL" "$WORK"
            git -C "$WORK" checkout --orphan gh-pages
            git -C "$WORK" rm -rf . >/dev/null 2>&1 || true
          fi

          cp "${GITHUB_WORKSPACE}/${CHART_TGZ}" "$WORK/"

          cd "$WORK"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          # --merge keeps entries for previously released chart versions that are
          # no longer present as local .tgz files.
          if [ -f index.yaml ]; then
            helm repo index . --url "${PAGES_URL}" --merge index.yaml
          else
            helm repo index . --url "${PAGES_URL}"
          fi

          git add --all
          git commit -m "Release Helm chart for ${GITHUB_REF_NAME}"
          git push origin gh-pages

      - name: Attach chart to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.package.outputs.chart_tgz }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
